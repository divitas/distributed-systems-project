chunk_size: 256

local_cpu: true
max_local_cpu_size: 5.0

local_disk: "file://.//lmcache_disk_store"
max_local_disk_size: 20.0

save_decode_cache: false

# LMCache disk offloading is disabled by default, and enabling it requires setting local_disk plus max_local_disk_size. Disk offload stores KV chunks as files and evicts when the configured capacity is exceeded.